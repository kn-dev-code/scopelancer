services:
  llm-agent:
    build:
      context: ./app/ai/src/llm-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./app/ai/src/llm-agent/.env
    environment:
      - PORT=8000
    restart: always
    develop: 
      watch:
        - action: sync+restart
          path: ./app/ai/src/llm-agent/app
          target: /llm-agent/app
        - action: rebuild
          path: ./app/ai/src/llm-agent/pyproject.toml