services:
  llm-agent:
    build:
      context: ./app/ai/src/llm-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./app/ai/src/llm-agent/.env
    environment:
      - PORT=8000
    restart: always
    develop: 
      watch:
        - action: sync+restart
          path: ./app/ai/src/llm-agent/app
          target: /llm-agent/app
        - action: rebuild
          path: ./app/ai/src/llm-agent/pyproject.toml
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always
    
      